<!DOCTYPE html>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMASK ｜ 価値を見極め、かたちにする</title>
<style>
  /* html/#root には背景を付けない。付けると body 背景のキャンバス伝播が止まり、
     各事業ページの固定背景（.jw/.pm/.wc-fixedbg＝position:fixed; z-index:-1）を
     覆い隠してしまう（Hero背景が消える不具合の原因）。
     3Dページ遷移の白フラッシュ対策は App.css の .wc2-boot / html.is-web-depart 側で
     自己完結しているため、ここで全体を暗色ベースにする必要はない。 */
  html, body, #root {
    margin: 0;
    min-height: 100%;
  }
  body {
    min-height: 100vh;
  }
</style>
<link rel="icon" href="/assets/favicon.jpg" type="image/jpeg">
<meta name="description" content="貴金属買取・ジュエリー制作・Webコンテンツ制作。SMASKは、それぞれ異なる領域で価値の本質を見極め、必要な形に整え、社会へ届けていきます。">

</head>

<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
